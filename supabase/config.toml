project_id = "jrsefbwmumoadncygjsz"

[functions.storefront-order]
verify_jwt = false

# The email worker is only ever invoked by our own database webhook and the
# pg_cron sweep, both of which send the service role key. Keeping JWT
# verification on means nobody else can poke it from the open internet.
[functions.email-worker]
verify_jwt = true

# Public webhook target for the storefront contact form, same as
# storefront-order: it authenticates with the shared secret in its own
# header, not a JWT.
[functions.storefront-contact]
verify_jwt = false

# The CRM's in-app assistant. Called from the browser with the publishable
# key, which is not a JWT, so gateway verification is off; the function
# checks AGENT_ALLOWED_ORIGINS itself and only ever returns model output.
[functions.support-agent]
verify_jwt = true

# Gateway behind the CRM's Connectors screen. Called from the browser with the
# publishable key (not a JWT), so gateway verification is off; the function
# checks CONNECTORS_ALLOWED_ORIGINS itself and keeps every token server-side.
[functions.connectors]
verify_jwt = false

# Auth Send-Email hook: called by Supabase Auth with a Standard Webhooks signature (verified in code), not a user JWT.
[functions.auth-send-email]
verify_jwt = false

# Admin-only staff invitations by team member name (role taken server-side from public.team).
[functions.crm-invite-staff]
verify_jwt = true
