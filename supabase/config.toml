[functions.storefront-order]
verify_jwt = false

# The email worker is only ever invoked by our own database webhook and the
# pg_cron sweep, both of which send the service role key. Keeping JWT
# verification on means nobody else can poke it from the open internet.
[functions.email-worker]
verify_jwt = true

# Public webhook target for the storefront contact form, same as
# storefront-order: it authenticates with the shared secret in its own
# header, not a JWT.
[functions.storefront-contact]
verify_jwt = false
